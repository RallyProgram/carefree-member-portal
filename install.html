<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f4fa8"><link rel="manifest" href="manifest.webmanifest"><title>Put Carefree on My Phone</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f7fb;color:#222}header{background:#1f4fa8;color:#fff;padding:20px}main{max-width:650px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #dce4ed;border-radius:14px;padding:20px;margin:14px 0}.btn{display:block;width:100%;border:0;background:#1f4fa8;color:#fff;padding:17px;border-radius:11px;font-weight:900;font-size:1.08rem}.muted{color:#687482;line-height:1.5}.ok{background:#e9f7ee;border-left:5px solid #28a745}</style></head><body><header><h2>🚐 Carefree Rally App</h2></header><main><div class="card"><h2>Put Carefree on your phone</h2><p class="muted">This is optional. You can always keep opening Carefree from your email.</p><button id="install" class="btn" hidden>PUT CAREFREE ON MY PHONE</button><div id="help" class="muted">Checking your phone for the easiest installation method…</div></div></main><script>let promptEvent=null;const b=document.getElementById('install'),h=document.getElementById('help');const standalone=()=>matchMedia('(display-mode:standalone)').matches||navigator.standalone===true;function showHelp(){if(standalone()){b.hidden=true;h.parentElement.classList.add('ok');h.innerHTML='<strong>Carefree is already on this phone.</strong>';return}if(/iPad|iPhone|iPod/.test(navigator.userAgent)){h.innerHTML='On iPhone use Safari: <strong>Share → Add to Home Screen → turn Open as Web App OFF → Add</strong>.';return}if(/Android/i.test(navigator.userAgent)){h.innerHTML='If the blue button does not appear, your browser may offer <strong>Install app</strong> or <strong>Add to Home screen</strong> from its menu.';return}h.textContent='You can continue using Carefree normally from your browser.'}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;b.hidden=false;h.textContent='Tap the blue button below, then confirm the installation.'});b.addEventListener('click',async()=>{if(!promptEvent)return;await promptEvent.prompt();promptEvent=null;b.hidden=true;showHelp()});window.addEventListener('appinstalled',()=>{promptEvent=null;b.hidden=true;h.parentElement.classList.add('ok');h.innerHTML='<strong>Carefree has been added to your phone.</strong>'});setTimeout(showHelp,1200);</script></body></html>
