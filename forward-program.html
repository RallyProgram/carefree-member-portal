<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f4fa8"><title>Carefree Forward Rally Program</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f7fb;color:#222}header{background:#1f4fa8;color:white;padding:18px}header h1{margin:0;font-size:1.4rem}main{max-width:800px;margin:auto;padding:12px}.card{background:white;border:1px solid #dde4ec;border-radius:12px;padding:15px;margin:12px 0}.rally{border-left:5px solid #1f4fa8}.name{font-weight:800;color:#143f88;font-size:1.08rem}.muted{color:#687482;margin-top:4px}.deadline{font-size:.9rem;margin-top:6px;color:#7a5000}.pill{display:inline-block;margin-top:8px;padding:5px 9px;border-radius:999px;background:#e8f0fe;color:#1f4fa8;font-size:.8rem;font-weight:800}.error{border-left:5px solid #c62828}</style></head><body><header><h1>🚐 Carefree Forward Rally Program</h1></header><main><div class="card">This is the current forward program from the same Carefree rally data used by the member app.</div><div id="list" class="card">Loading…</div></main><script>const API='https://bxnweucdcnntsfywzzcg.supabase.co/functions/v1/member-api';function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(s){if(!s)return'';const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}function getToken(){const u=new URL(location.href),t=u.searchParams.get('t');if(t){localStorage.setItem('carefree_member_token',t);return t}return localStorage.getItem('carefree_member_token')||''}async function load(){const root=document.getElementById('list'),token=getToken();if(!token){root.className='card error';root.innerHTML='<strong>Personal member link required.</strong><div class="muted">Open your Carefree Rally App from your personal email link first.</div>';return}try{const r=await fetch(API,{headers:{'x-member-token':token,'Cache-Control':'no-cache'},cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load');const today=d.today||new Date().toISOString().slice(0,10),rs=(d.rallies||[]).filter(x=>x.start_date>=today).sort((a,b)=>a.start_date.localeCompare(b.start_date));root.className='';root.innerHTML=rs.length?rs.map(x=>'<div class="card rally"><div class="name">'+esc(x.name)+'</div><div>'+fmt(x.start_date)+(x.finish_date&&x.finish_date!==x.start_date?' to '+fmt(x.finish_date):'')+'</div>'+(x.park_name?'<div class="muted">'+esc(x.park_name)+'</div>':'')+(x.response_deadline?'<div class="deadline">Response cut-off: '+fmt(x.response_deadline)+'</div>':'')+'<span class="pill">Your response: '+esc(x.response||'NO RESPONSE')+'</span></div>').join(''):'<div class="card">No future rallies are currently listed.</div>'}catch(e){root.className='card error';root.textContent=e.message}}load();</script></body></html>
