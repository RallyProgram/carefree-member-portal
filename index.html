<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4fa8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carefree Rallies">
<title>Carefree Rally App</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f7fb;color:#222}header{background:linear-gradient(135deg,#143f88,#2d6bb8);color:#fff;padding:18px}header h1{margin:0;font-size:1.45rem}header p{margin:5px 0 0;opacity:.92}main{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #dde4ec;border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:0 3px 12px #0000000b}.welcome{border-left:5px solid #1f4fa8}.rally{border-left:5px solid #1f4fa8}.rally h3{margin:0 0 5px}.muted{color:#687482;font-size:.92rem}.choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.choices button{flex:1;min-width:82px;min-height:46px;border:2px solid #ccd5df;background:#fff;border-radius:9px;font-weight:800;font-size:1rem}.yes.on{background:#28a745;color:#fff;border-color:#28a745}.maybe.on{background:#efa72f;color:#111;border-color:#efa72f}.no.on{background:#dc3545;color:#fff;border-color:#dc3545}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8f0fe;color:#1f4fa8;font-weight:800;font-size:.76rem;margin-bottom:7px}.deadline{font-weight:700;color:#8a5a00;margin-top:7px}.urgent{color:#b02a2a}.expense{border-left:5px solid #7b5cb8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:12px}label{font-weight:700;font-size:.93rem}input,textarea{width:100%;font-size:16px;padding:12px;border:1px solid #cbd5df;border-radius:8px;margin-top:5px;font-family:inherit}textarea{min-height:76px;resize:vertical}.primary{border:0;background:#1f4fa8;color:#fff;padding:12px 16px;border-radius:9px;font-weight:800;font-size:1rem;margin-top:12px;cursor:pointer}.secondary{border:1px solid #1f4fa8;background:#fff;color:#1f4fa8;padding:9px 12px;border-radius:8px;font-weight:800;margin-top:8px;cursor:pointer}.notice{background:#eef5fb;border-left:4px solid #1f4fa8;padding:13px;border-radius:9px;margin-bottom:14px}.error{background:#fdecec;border-left-color:#c62828;color:#8a1c1c}.good{color:#19863f;font-weight:800}.attention{background:#fff7dd;border:1px solid #ecd28a;border-radius:12px;padding:14px;margin-bottom:14px}.attention strong{color:#7f5600}.venue{margin-top:9px;padding:9px 10px;background:#f7f9fc;border-radius:8px}.venue strong{color:#143f88}.noteWrap{margin-top:12px;padding-top:10px;border-top:1px solid #e4e8ee}.noteHelp{font-size:.8rem;color:#6d7782;margin-top:4px}h2{color:#1f4fa8;font-size:1.18rem;margin:20px 0 10px}.spinner{text-align:center;padding:40px;color:#657181}.small{font-size:.84rem;color:#6d7782}.money{position:relative;margin-top:5px}.money span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-weight:800;color:#333;pointer-events:none}.money input{margin-top:0;padding-left:27px}@media(max-width:520px){main{padding:10px}.card{padding:14px}.choices button{min-width:76px}}
</style>
</head>
<body>
<header><h1>🚐 Carefree Rally App</h1><p>Rally intentions and expenses</p></header>
<main><div id="setup" class="card"><strong>Personal member link required</strong><p class="muted">Normally you will arrive here from your private Carefree link. For testing, you can paste the full personal link below.</p><input id="linkInput" placeholder="Paste the full Open Portal link here"><button class="primary" onclick="useLink()">Open My Rally Page</button></div><div id="app"></div></main>
<script>
const API='https://bxnweucdcnntsfywzzcg.supabase.co/functions/v1/member-api';
const EXPENSE_ROLLOUT_DATE='2026-08-27';
let token='';let data=null;
function fmt(s){if(!s)return'';const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function firstName(s){return String(s||'').trim().split(/\s+/)[0]||''}
function greetingName(member){const p1=firstName(member.person1_name),p2=firstName(member.person2_name);if(p1&&p2)return p1+' & '+p2;if(p1)return p1;return member.display_name||'Member'}
function todayYmd(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysTo(s){if(!s)return null;const a=new Date(todayYmd()+'T00:00:00'),b=new Date(s+'T00:00:00');return Math.round((b-a)/86400000)}
async function api(method='GET',body=null){const r=await fetch(API,{method,headers:{'Content-Type':'application/json','x-member-token':token},body:body?JSON.stringify(body):null});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
function tokenFromLink(v){try{const u=new URL(v);return u.searchParams.get('t')||''}catch(e){return v.trim()}}
function useLink(){const v=document.getElementById('linkInput').value.trim();const t=tokenFromLink(v);if(!t){alert('Please paste your personal Member Portal link.');return}localStorage.setItem('carefree_member_token',t);token=t;load()}
function tokenFromUrl(){const u=new URL(location.href);const t=u.searchParams.get('t');if(t){localStorage.setItem('carefree_member_token',t);return t}return localStorage.getItem('carefree_member_token')||''}
function urlParams(){return new URL(location.href).searchParams}
function expenseTarget(){return (urlParams().get('expense_rally')||'').trim()}
function expenseEligible(r){const n=String(r.name||'').toLowerCase();return !n.includes('agm')&&!n.includes('january lunch')&&!n.includes('july lunch')}
async function load(){token=token||tokenFromUrl();const setup=document.getElementById('setup'),root=document.getElementById('app');if(!token){setup.style.display='block';root.innerHTML='';return}setup.style.display='none';root.className='spinner';root.textContent='Loading your rallies…';try{data=await api();render()}catch(e){setup.style.display='block';root.className='';root.innerHTML='<div class="notice error"><strong>Unable to open your rally page.</strong><br>'+esc(e.message)+'</div>'}}
function noteValue(id){return document.getElementById('note_'+id)?.value||''}
async function setResponse(id,response){try{await api('POST',{action:'response',rally_id:id,response,member_note:noteValue(id)});await load()}catch(e){alert(e.message)}}
async function saveNote(id){try{await api('POST',{action:'note',rally_id:id,member_note:noteValue(id)});await load();alert('Note saved.')}catch(e){alert(e.message)}}
function moneyValue(id){const raw=(document.getElementById(id)?.value||'').trim();if(!raw)return 0;const n=Number(raw);return Number.isFinite(n)&&n>=0?n:NaN}
async function saveExpense(id){const park=moneyValue('park_'+id),other=moneyValue('other_'+id);if(Number.isNaN(park)||Number.isNaN(other)){alert('Please enter valid dollar amounts.');return}try{await api('POST',{action:'expenses',rally_id:id,park_fees:park,all_other_expenses:other});await load();alert('Expenses saved. Thank you.')}catch(e){alert(e.message)}}
function moneyField(id,value){const shown=Number(value||0)>0?Number(value).toFixed(2):'';return '<div class="money"><span>$</span><input id="'+id+'" type="number" min="0" step="0.01" inputmode="decimal" placeholder="" value="'+shown+'"></div>'}
function expenseCard(r){return '<div id="expense-rally-'+r.id+'" class="card expense"><h3 style="margin:0 0 5px">'+esc(r.name)+'</h3><div class="muted">'+fmt(r.start_date)+' to '+fmt(r.finish_date)+'</div><div class="grid"><label>Park Fees'+moneyField('park_'+r.id,r.park_fees)+'</label><label>All Other Expenses'+moneyField('other_'+r.id,r.all_other_expenses)+'</label></div><button class="primary" onclick="saveExpense('+r.id+')">Save Expenses</button><div class="small" style="margin-top:8px">'+(r.expense_submitted_at?'<span class="good">✓ Submitted</span>':'Expenses still required')+'</div></div>'}
function render(){const root=document.getElementById('app'),now=todayYmd(),member=data.member||{},rs=data.rallies||[];const upcoming=rs.filter(r=>r.start_date>=now&&(!r.response_deadline||r.response_deadline>=now)).sort((a,b)=>(Number(b.priority)-Number(a.priority))||a.start_date.localeCompare(b.start_date)).slice(0,7);const expense=rs.filter(r=>r.finish_date<now&&r.finish_date>=EXPENSE_ROLLOUT_DATE&&r.attended===true&&expenseEligible(r));const actions=[];upcoming.forEach(r=>{const d=daysTo(r.response_deadline);if(!r.response)actions.push(esc(r.name)+' — response required'+(d!==null?' by '+fmt(r.response_deadline):''));else if(r.response==='MAYBE'&&d!==null&&d<=3)actions.push(esc(r.name)+' — please make a final decision')});expense.forEach(r=>{if(!r.expense_submitted_at)actions.push(esc(r.name)+' — expenses required')});let h='<div class="card welcome"><strong>Hello '+esc(greetingName(member))+'</strong><div class="muted">Please keep your own rally choices up to date.</div></div>';h+='<div class="attention"><strong>'+(actions.length?actions.length+' item(s) need your attention':'✓ You are up to date')+'</strong>'+(actions.length?'<ul>'+actions.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'')+'</div>';h+='<h2>Upcoming rallies</h2>';if(!upcoming.length)h+='<div class="notice">No upcoming rallies are currently listed.</div>';upcoming.forEach((r,i)=>{const d=daysTo(r.response_deadline);const venue=(r.park_name||r.park_address||r.park_phone)?'<div class="venue">'+(r.park_name?'<strong>📍 '+esc(r.park_name)+'</strong>':'')+(r.park_address?'<div class="muted" style="margin-top:3px">'+esc(r.park_address)+'</div>':'')+(r.park_phone?'<div style="margin-top:5px"><a href="tel:'+esc(r.park_phone).replace(/\s/g,'')+'">📞 '+esc(r.park_phone)+'</a></div>':'')+'</div>':'';h+='<div class="card rally"><span class="badge">'+(r.priority?'⭐ PRIORITY':(i===0?'NEXT RALLY':'UPCOMING'))+'</span><h3>'+esc(r.name)+'</h3>'+(r.priority_message?'<div class="notice" style="margin:8px 0">'+esc(r.priority_message)+'</div>':'')+venue+'<div class="muted" style="margin-top:8px">'+fmt(r.start_date)+' to '+fmt(r.finish_date)+'</div>'+(r.response_deadline?'<div class="deadline '+(d!==null&&d<0?'urgent':'')+'">Please respond by '+fmt(r.response_deadline)+'</div>':'')+'<div class="choices"><button class="yes '+(r.response==='YES'?'on':'')+'" onclick="setResponse('+r.id+',\'YES\')">YES</button><button class="maybe '+(r.response==='MAYBE'?'on':'')+'" onclick="setResponse('+r.id+',\'MAYBE\')">MAYBE</button><button class="no '+(r.response==='NO'?'on':'')+'" onclick="setResponse('+r.id+',\'NO\')">NO</button></div><div class="small" style="margin-top:9px">Current response: <strong>'+(r.response||'NO RESPONSE')+'</strong></div><div class="noteWrap"><label for="note_'+r.id+'">Note for Rally Coordinator <span class="small">(optional)</span></label><textarea id="note_'+r.id+'" maxlength="1000" placeholder="Examples: Committee meeting only, arriving late, special circumstances…">'+esc(r.member_note||'')+'</textarea><div class="noteHelp">Your note is private to the club coordinator. Choose YES, MAYBE or NO to save it with your response, or use Save Note after you have responded.</div><button class="secondary" onclick="saveNote('+r.id+')">Save Note</button></div></div>'});h+='<h2 id="post-rally-expenses">Post-rally expenses</h2><div class="notice">Enter the two figures required for ACCSA reporting: <strong>Park Fees</strong> and <strong>All Other Expenses</strong>.</div>';if(!expense.length)h+='<div class="small">No completed rallies currently require expense entry.</div>';expense.forEach(r=>{h+=expenseCard(r)});root.className='';root.innerHTML=h;setTimeout(()=>{let target=null;const wanted=expenseTarget();if(wanted){const r=expense.find(x=>String(x.id)===wanted||String(x.name).toLowerCase()===wanted.toLowerCase());if(r)target=document.getElementById('expense-rally-'+r.id)}if(!target&&urlParams().get('view')==='expenses')target=document.getElementById('post-rally-expenses');if(target)target.scrollIntoView({behavior:'smooth',block:'start'})},150)}
load();
</script>
</body>
</html>
