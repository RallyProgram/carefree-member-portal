<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f4fa8"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Carefree Rallies"><title>Carefree Rally App</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f7fb;color:#222}header{background:linear-gradient(135deg,#143f88,#2d6bb8);color:#fff;padding:18px}header h1{margin:0;font-size:1.45rem}header p{margin:5px 0 0;opacity:.92}main{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #dde4ec;border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:0 3px 12px #0000000b}.welcome,.rally{border-left:5px solid #1f4fa8}.priorityCard{border-left-color:#d18a00;background:#fffdf5}.lateCard{border-left:5px solid #d18a00;background:#fffdf5}.muted{color:#687482;font-size:.92rem}.choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.choices button{flex:1;min-width:82px;min-height:46px;border:2px solid #ccd5df;background:#fff;border-radius:9px;font-weight:800;font-size:1rem}.yes.on{background:#28a745;color:#fff;border-color:#28a745}.maybe.on{background:#efa72f;color:#111;border-color:#efa72f}.no.on{background:#dc3545;color:#fff;border-color:#dc3545}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e8f0fe;color:#1f4fa8;font-weight:800;font-size:.76rem;margin-bottom:7px}.priorityBadge{background:#fff0bf;color:#7a5000}.deadline{font-weight:700;color:#8a5a00;margin-top:7px}.expense{border-left:5px solid #7b5cb8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:12px}label{font-weight:700;font-size:.93rem}input,textarea{width:100%;font-size:16px;padding:12px;border:1px solid #cbd5df;border-radius:8px;margin-top:5px;font-family:inherit}textarea{min-height:76px;resize:vertical}.primary{border:0;background:#1f4fa8;color:#fff;padding:12px 16px;border-radius:9px;font-weight:800;font-size:1rem;margin-top:12px}.secondary{border:1px solid #1f4fa8;background:#fff;color:#1f4fa8;padding:9px 12px;border-radius:8px;font-weight:800;margin-top:8px}.lateButton{border:0;background:#a66b00;color:#fff;padding:12px 16px;border-radius:9px;font-weight:800;font-size:1rem;margin-top:10px;width:100%}.notice{background:#eef5fb;border-left:4px solid #1f4fa8;padding:13px;border-radius:9px;margin-bottom:14px}.error{background:#fdecec;border-left-color:#c62828;color:#8a1c1c}.attention{background:#fff7dd;border:1px solid #ecd28a;border-radius:12px;padding:14px;margin-bottom:14px}.venue{margin-top:9px;padding:9px 10px;background:#f7f9fc;border-radius:8px}.venue strong{color:#143f88}.noteWrap{margin-top:12px;padding-top:10px;border-top:1px solid #e4e8ee}.small{font-size:.84rem;color:#6d7782}.saved{display:none;margin-top:9px;padding:8px 10px;background:#e9f7ee;color:#176b34;border-radius:8px;font-weight:800}.saved.show{display:block}.money{position:relative;margin-top:5px}.money span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-weight:800}.money input{margin-top:0;padding-left:27px}h2{color:#1f4fa8;font-size:1.18rem;margin:20px 0 10px}.spinner{text-align:center;padding:40px;color:#657181}@media(max-width:520px){main{padding:10px}.card{padding:14px}}</style></head>
<body><header><h1>🚐 Carefree Rally App</h1><p>Your rally choices and expenses</p></header><main><div id="setup" class="card"><strong>Personal member link required</strong><p class="muted">Please open this App from the personal setup button in your Carefree email. There is normally nothing to copy or paste.</p></div><div id="app"></div></main>
<script>
const API='https://bxnweucdcnntsfywzzcg.supabase.co/functions/v1/member-api',EXPENSE_ROLLOUT_DATE='2026-08-27';let token='',data=null,lastLoadedAt=0,refreshing=false;
function fmt(s){if(!s)return'';const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function firstName(s){return String(s||'').trim().split(/\s+/)[0]||''}function greetingName(m){const a=firstName(m.person1_name),b=firstName(m.person2_name);return a&&b?a+' & '+b:a||m.display_name||'Member'}function todayYmd(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function daysTo(s){if(!s)return null;return Math.round((new Date(s+'T00:00:00')-new Date(todayYmd()+'T00:00:00'))/86400000)}
async function api(method='GET',body=null){const r=await fetch(API,{method,headers:{'Content-Type':'application/json','x-member-token':token,'Cache-Control':'no-cache'},cache:'no-store',body:body?JSON.stringify(body):null});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}function tokenFromUrl(){const u=new URL(location.href),t=u.searchParams.get('t');if(t){localStorage.setItem('carefree_member_token',t);history.replaceState({},'',location.pathname+location.search.replace(/([?&])t=[^&]*&?/,'$1').replace(/[?&]$/,''));return t}return localStorage.getItem('carefree_member_token')||''}function noteValue(id){return document.getElementById('note_'+id)?.value||''}function showSaved(id,msg='✓ Saved — your change has been sent to the Rally Coordinator'){const e=document.getElementById('saved_'+id);if(e){e.textContent=msg;e.classList.add('show')}}
async function load(keepId=null){if(refreshing)return;refreshing=true;token=token||tokenFromUrl();const setup=document.getElementById('setup'),root=document.getElementById('app');if(!token){setup.style.display='block';root.innerHTML='';refreshing=false;return}setup.style.display='none';if(!keepId&&!data){root.className='spinner';root.textContent='Loading your rallies…'}try{data=await api();lastLoadedAt=Date.now();render(keepId)}catch(e){if(!data){setup.style.display='block';root.className='';root.innerHTML='<div class="notice error"><strong>Unable to open your rally page.</strong><br>'+esc(e.message)+'</div>'}}finally{refreshing=false}}
async function setResponse(id,response){const btns=document.querySelectorAll('#rally_'+id+' button,#late_'+id+' button');btns.forEach(b=>b.disabled=true);try{const j=await api('POST',{action:'response',rally_id:id,response,member_note:noteValue(id)});if(j.late_yes){const p=[j.park_name,j.park_address,j.park_phone?'Ph: '+j.park_phone:''].filter(Boolean).join('\n');alert('Your late change to YES has been saved.\n\nThe club attendance list has already been prepared. Please contact the caravan park directly to check availability and arrange your booking/deposit.\n\n'+p+'\n\nThe Rally Coordinator has also been notified.')}await load(id);showSaved(id,j.late_yes?'✓ Late YES saved — park instructions sent and Rally Coordinator notified':'✓ Saved — your response and note have been sent')}catch(e){alert(e.message);btns.forEach(b=>b.disabled=false)}}
async function saveNote(id){try{await api('POST',{action:'note',rally_id:id,member_note:noteValue(id)});await load(id);showSaved(id,'✓ Note saved and sent')}catch(e){alert(e.message)}}
function moneyValue(id){const raw=(document.getElementById(id)?.value||'').trim();if(!raw)return 0;const n=Number(raw);return Number.isFinite(n)&&n>=0?n:NaN}async function saveExpense(id){const park=moneyValue('park_'+id),other=moneyValue('other_'+id);if(Number.isNaN(park)||Number.isNaN(other)){alert('Please enter valid dollar amounts.');return}try{await api('POST',{action:'expenses',rally_id:id,park_fees:park,all_other_expenses:other});await load();alert('✓ Expenses saved and sent. Thank you.')}catch(e){alert(e.message)}}function moneyField(id,value){const shown=Number(value||0)>0?Number(value).toFixed(2):'';return '<div class="money"><span>$</span><input id="'+id+'" type="number" min="0" step="0.01" inputmode="decimal" value="'+shown+'"></div>'}function expenseEligible(r){const n=String(r.name||'').toLowerCase();return !n.includes('agm')&&!n.includes('january lunch')&&!n.includes('july lunch')}
function venueHtml(r){return (r.park_name||r.park_address||r.park_phone)?'<div class="venue">'+(r.park_name?'<strong>📍 '+esc(r.park_name)+'</strong>':'')+(r.park_address?'<div class="muted">'+esc(r.park_address)+'</div>':'')+(r.park_phone?'<div><a href="tel:'+esc(r.park_phone).replace(/\s/g,'')+'">📞 '+esc(r.park_phone)+'</a></div>':'')+'</div>':''}
function render(keepId=null){const root=document.getElementById('app'),now=todayYmd(),member=data.member||{},rs=data.rallies||[];const upcoming=rs.filter(r=>r.start_date>=now&&(!r.response_deadline||r.response_deadline>=now)).sort((a,b)=>(Number(b.priority)-Number(a.priority))||a.start_date.localeCompare(b.start_date)).slice(0,8);const late=rs.filter(r=>r.start_date>=now&&r.response_deadline&&r.response_deadline<now&&r.response!=='YES').sort((a,b)=>a.start_date.localeCompare(b.start_date));const expense=rs.filter(r=>r.finish_date<now&&r.finish_date>=EXPENSE_ROLLOUT_DATE&&r.attended===true&&expenseEligible(r));const actions=[];upcoming.forEach(r=>{const d=daysTo(r.response_deadline);if(!r.response)actions.push(esc(r.name)+' — response required');else if(r.response==='MAYBE'&&d!==null&&d>=0&&d<=3)actions.push(esc(r.name)+' — please make a final decision')});expense.forEach(r=>{if(!r.expense_submitted_at)actions.push(esc(r.name)+' — expenses required')});let h='<div class="card welcome"><strong>Hello '+esc(greetingName(member))+'</strong><div class="muted">Your selections save automatically. Look for the green ✓ Saved message after each change.</div></div><div class="attention"><strong>'+(actions.length?actions.length+' item(s) need your attention':'✓ You are up to date')+'</strong>'+(actions.length?'<ul>'+actions.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'')+'</div><h2>Upcoming rallies</h2>';
if(!upcoming.length)h+='<div class="notice">No rallies are currently open for normal responses.</div>';upcoming.forEach((r,i)=>{h+='<div id="rally_'+r.id+'" class="card rally '+(r.priority?'priorityCard':'')+'"><span class="badge '+(r.priority?'priorityBadge':'')+'">'+(r.priority?'⭐ PRIORITY RALLY':(i===0?'NEXT RALLY':'UPCOMING'))+'</span><h3>'+esc(r.name)+'</h3>'+(r.priority?'<div class="small"><strong>This rally is shown first because it has been marked as a priority.</strong></div>':'')+(r.priority_message?'<div class="notice">'+esc(r.priority_message)+'</div>':'')+venueHtml(r)+'<div class="muted" style="margin-top:8px">'+fmt(r.start_date)+' to '+fmt(r.finish_date)+'</div>'+(r.response_deadline?'<div class="deadline">Response cut-off: '+fmt(r.response_deadline)+'</div>':'')+'<div class="choices"><button class="yes '+(r.response==='YES'?'on':'')+'" onclick="setResponse('+r.id+',\'YES\')">YES</button><button class="maybe '+(r.response==='MAYBE'?'on':'')+'" onclick="setResponse('+r.id+',\'MAYBE\')">MAYBE</button><button class="no '+(r.response==='NO'?'on':'')+'" onclick="setResponse('+r.id+',\'NO\')">NO</button></div><div class="small" style="margin-top:9px">Current response: <strong>'+(r.response||'NO RESPONSE')+'</strong></div><div id="saved_'+r.id+'" class="saved">✓ Saved</div><div class="noteWrap"><label>Note for Rally Coordinator <span class="small">(optional)</span></label><textarea id="note_'+r.id+'" maxlength="1000">'+esc(r.member_note||'')+'</textarea><div class="small">Your note is saved with your response. You can also use Save Note.</div><button class="secondary" onclick="saveNote('+r.id+')">Save Note</button></div></div>'});
h+='<h2>Late rally change</h2><div class="notice">These rallies have passed their normal response cut-off. If you previously said NO or MAYBE, or did not respond, you can still request a late change to <strong>YES</strong>. You must contact the park directly to check availability and arrange your booking/deposit.</div>';if(!late.length)h+='<div class="small">No late rally changes are currently available.</div>';late.forEach(r=>{h+='<div id="late_'+r.id+'" class="card lateCard"><span class="badge priorityBadge">LATE CHANGE AVAILABLE</span><h3>'+esc(r.name)+'</h3><div class="muted">'+fmt(r.start_date)+' to '+fmt(r.finish_date)+'</div><div class="deadline">Response cut-off passed: '+fmt(r.response_deadline)+'</div><div class="small" style="margin-top:8px">Current response: <strong>'+(r.response||'NO RESPONSE')+'</strong></div>'+venueHtml(r)+'<button class="lateButton" onclick="setResponse('+r.id+',\'YES\')">Change to YES — Late Request</button><div id="saved_'+r.id+'" class="saved">✓ Saved</div></div>'});
h+='<h2 id="post-rally-expenses">Post-rally expenses</h2><div class="notice">Enter <strong>Park Fees</strong> and <strong>All Other Expenses</strong> for ACCSA reporting.</div>';if(!expense.length)h+='<div class="small">No completed rallies currently require expense entry.</div>';expense.forEach(r=>{h+='<div class="card expense"><h3>'+esc(r.name)+'</h3><div class="grid"><label>Park Fees'+moneyField('park_'+r.id,r.park_fees)+'</label><label>All Other Expenses'+moneyField('other_'+r.id,r.all_other_expenses)+'</label></div><button class="primary" onclick="saveExpense('+r.id+')">Save Expenses</button></div>'});root.className='';root.innerHTML=h;if(keepId)setTimeout(()=>{(document.getElementById('rally_'+keepId)||document.getElementById('late_'+keepId))?.scrollIntoView({block:'center'})},50)}
function refreshOnReturn(){if(document.visibilityState==='visible'&&tokenFromUrl()&&Date.now()-lastLoadedAt>1000)load()}
document.addEventListener('visibilitychange',refreshOnReturn);window.addEventListener('pageshow',()=>{if(lastLoadedAt)load()});window.addEventListener('focus',()=>{if(lastLoadedAt&&Date.now()-lastLoadedAt>1000)load()});load();
</script></body></html>
