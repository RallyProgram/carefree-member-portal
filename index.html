<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f4fa8"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Carefree Rallies"><title>Carefree Rally App</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f7fb;color:#222}header{background:linear-gradient(135deg,#143f88,#2d6bb8);color:#fff;padding:18px}header h1{margin:0;font-size:1.45rem}header p{margin:5px 0 0;opacity:.92}main{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #dde4ec;border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:0 3px 12px #0000000b}.welcome,.rally{border-left:5px solid #1f4fa8}.muted{color:#687482;font-size:.92rem}.small{font-size:.84rem;color:#6d7782}.notice{background:#eef5fb;border-left:4px solid #1f4fa8;padding:13px;border-radius:9px;margin-bottom:14px}.error{background:#fdecec;border-left-color:#c62828;color:#8a1c1c}.attention{background:#fff7dd;border:1px solid #ecd28a;border-radius:12px;padding:14px;margin-bottom:14px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e8f0fe;color:#1f4fa8;font-weight:800;font-size:.76rem;margin-bottom:7px}.deadline{font-weight:700;color:#8a5a00;margin-top:7px}.venue{margin-top:9px;padding:9px 10px;background:#f7f9fc;border-radius:8px}.venue strong{color:#143f88}.choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.choices button{flex:1;min-width:82px;min-height:46px;border:2px solid #ccd5df;background:#fff;border-radius:9px;font-weight:800;font-size:1rem}.yes.on{background:#28a745;color:#fff;border-color:#28a745}.maybe.on{background:#efa72f;color:#111;border-color:#efa72f}.no.on{background:#dc3545;color:#fff;border-color:#dc3545}.secondary{border:1px solid #1f4fa8;background:#fff;color:#1f4fa8;padding:9px 12px;border-radius:8px;font-weight:800;margin-top:8px}.installCard{border:2px solid #1f4fa8;background:#f7fbff}.installButton,.programButton{display:block;width:100%;border:0;background:#1f4fa8;color:#fff;padding:15px 16px;border-radius:10px;font-weight:900;font-size:1.05rem;margin-top:10px;text-align:center;text-decoration:none}.programButton{background:#143f88}.forwardCard{border-left:5px solid #1f4fa8}.forwardRow{padding:12px 0;border-top:1px solid #e2e8ef}.forwardRow:first-of-type{border-top:0}.forwardName{font-weight:800;color:#143f88}.responsePill{display:inline-block;margin-top:5px;padding:4px 8px;border-radius:999px;background:#eef3f8;font-size:.78rem;font-weight:800}.noteWrap{margin-top:12px;padding-top:10px;border-top:1px solid #e4e8ee}label{font-weight:700;font-size:.93rem}textarea{width:100%;font-size:16px;padding:12px;border:1px solid #cbd5df;border-radius:8px;margin-top:5px;font-family:inherit;min-height:56px}.saved{display:none;margin-top:9px;padding:8px 10px;background:#e9f7ee;color:#176b34;border-radius:8px;font-weight:800}.saved.show{display:block}h2{color:#1f4fa8;font-size:1.18rem;margin:20px 0 10px}.spinner{text-align:center;padding:40px;color:#657181}@media(max-width:520px){main{padding:10px}.card{padding:14px}}</style></head>
<body><header><h1>🚐 Carefree Rally App</h1><p>Your rally choices and forward rally program</p></header><main><div id="setup" class="card"><strong>Personal member link required</strong><p class="muted">Please open this App from the personal setup button in your Carefree email. There is normally nothing to copy or paste.</p></div><div id="installArea"></div><div id="app"></div></main>
<script>
const API='https://bxnweucdcnntsfywzzcg.supabase.co/functions/v1/member-api';let token='',data=null,lastLoadedAt=0,refreshing=false,deferredInstallPrompt=null;
function fmt(s){if(!s)return'';const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function firstName(s){return String(s||'').trim().split(/\s+/)[0]||''}function greetingName(m){const a=firstName(m.person1_name),b=firstName(m.person2_name);return a&&b?a+' & '+b:a||m.display_name||'Member'}function todayYmd(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)}function tokenFromUrl(){const u=new URL(location.href),t=u.searchParams.get('t');if(t){localStorage.setItem('carefree_member_token',t);history.replaceState({},'',location.pathname);return t}return localStorage.getItem('carefree_member_token')||''}
async function api(method='GET',body=null){const r=await fetch(API,{method,headers:{'Content-Type':'application/json','x-member-token':token,'Cache-Control':'no-cache'},cache:'no-store',body:body?JSON.stringify(body):null});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
function standalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}function android(){return /Android/i.test(navigator.userAgent)}function ios(){return /iPad|iPhone|iPod/.test(navigator.userAgent)}
function drawInstall(){const e=document.getElementById('installArea');if(standalone()){e.innerHTML='';return}if(deferredInstallPrompt){e.innerHTML='<div class="card installCard"><strong>Put Carefree on your phone</strong><div class="muted">Optional — Carefree will still work from your email link.</div><button class="installButton" onclick="installCarefree()">PUT CAREFREE ON MY PHONE</button></div>';return}if(ios()){e.innerHTML='<div class="card installCard"><strong>Put Carefree on your iPhone — optional</strong><div class="muted">In Safari: Share → Add to Home Screen → turn <strong>Open as Web App OFF</strong> → Add.</div></div>';return}if(android()){e.innerHTML='<div class="card installCard"><strong>Put Carefree on your phone — optional</strong><div class="muted">If the blue install button does not appear yet, continue using Carefree normally. Your browser may offer Install App/Add to Home Screen.</div></div>';return}e.innerHTML=''}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;drawInstall()});window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;drawInstall()});async function installCarefree(){if(!deferredInstallPrompt)return;await deferredInstallPrompt.prompt();deferredInstallPrompt=null;drawInstall()}
function venueHtml(r){return (r.park_name||r.park_address||r.park_phone)?'<div class="venue">'+(r.park_name?'<strong>📍 '+esc(r.park_name)+'</strong>':'')+(r.park_address?'<div class="muted">'+esc(r.park_address)+'</div>':'')+(r.park_phone?'<div>📞 '+esc(r.park_phone)+'</div>':'')+'</div>':''}
function noteValue(id){return document.getElementById('note_'+id)?.value||''}function showSaved(id,msg='✓ Saved'){const e=document.getElementById('saved_'+id);if(e){e.textContent=msg;e.classList.add('show')}}
async function setResponse(id,response){try{await api('POST',{action:'response',rally_id:id,response,member_note:noteValue(id)});await load(id);showSaved(id,'✓ Saved — your response has been sent to the Rally Coordinator')}catch(e){alert(e.message)}}async function saveNote(id){try{await api('POST',{action:'note',rally_id:id,member_note:noteValue(id)});await load(id);showSaved(id,'✓ Note saved and sent')}catch(e){alert(e.message)}}
function forwardProgram(rs,now){const future=rs.filter(r=>r.start_date>=now).sort((a,b)=>a.start_date.localeCompare(b.start_date));let h='<h2 id="forward-program">Carefree Forward Rally Program</h2><div class="card forwardCard"><div class="muted" style="margin-bottom:8px">This program comes from the same current rally information used by your Carefree Rally App.</div>';if(!future.length)h+='<div>No future rallies are currently listed.</div>';future.forEach(r=>{h+='<div class="forwardRow"><div class="forwardName">'+esc(r.name)+'</div><div>'+fmt(r.start_date)+(r.finish_date&&r.finish_date!==r.start_date?' to '+fmt(r.finish_date):'')+'</div>'+(r.park_name?'<div class="muted">'+esc(r.park_name)+'</div>':'')+(r.response_deadline?'<div class="small">Response cut-off: '+fmt(r.response_deadline)+'</div>':'')+'<span class="responsePill">Your response: '+esc(r.response||'NO RESPONSE')+'</span></div>'});return h+'</div>'}
function render(keepId=null){const root=document.getElementById('app'),now=data.today||todayYmd(),member=data.member||{},rs=data.rallies||[];const upcoming=rs.filter(r=>r.start_date>=now&&(!r.response_deadline||r.response_deadline>=now)).sort((a,b)=>(Number(b.priority)-Number(a.priority))||a.start_date.localeCompare(b.start_date)).slice(0,8);let h='<div class="card welcome"><strong>Hello '+esc(greetingName(member))+'</strong><div class="muted">Check your upcoming rallies and update any response if your plans have changed.</div><button class="programButton" onclick="document.getElementById(\'forward-program\').scrollIntoView({behavior:\'smooth\'})">VIEW CAREFREE FORWARD RALLY PROGRAM</button></div><h2>Upcoming rallies</h2>';if(!upcoming.length)h+='<div class="notice">No rallies are currently open for normal responses.</div>';upcoming.forEach((r,i)=>{h+='<div id="rally_'+r.id+'" class="card rally"><span class="badge">'+(i===0?'NEXT RALLY':'UPCOMING')+'</span><h3>'+esc(r.name)+'</h3>'+venueHtml(r)+'<div class="muted">'+fmt(r.start_date)+' to '+fmt(r.finish_date)+'</div>'+(r.response_deadline?'<div class="deadline">Response cut-off: '+fmt(r.response_deadline)+'</div>':'')+'<div class="choices"><button class="yes '+(r.response==='YES'?'on':'')+'" onclick="setResponse('+r.id+',\'YES\')">YES</button><button class="maybe '+(r.response==='MAYBE'?'on':'')+'" onclick="setResponse('+r.id+',\'MAYBE\')">MAYBE</button><button class="no '+(r.response==='NO'?'on':'')+'" onclick="setResponse('+r.id+',\'NO\')">NO</button></div><div class="small" style="margin-top:9px">Current response: <strong>'+esc(r.response||'NO RESPONSE')+'</strong></div><div id="saved_'+r.id+'" class="saved">✓ Saved</div><div class="noteWrap"><label>Note for Rally Coordinator <span class="small">(optional)</span></label><textarea id="note_'+r.id+'" maxlength="1000">'+esc(r.member_note||'')+'</textarea><button class="secondary" onclick="saveNote('+r.id+')">Save Note</button></div></div>'});h+=forwardProgram(rs,now);root.className='';root.innerHTML=h;if(keepId)setTimeout(()=>document.getElementById('rally_'+keepId)?.scrollIntoView({block:'center'}),50)}
async function load(keepId=null){if(refreshing)return;refreshing=true;token=token||tokenFromUrl();drawInstall();const setup=document.getElementById('setup'),root=document.getElementById('app');if(!token){setup.style.display='block';root.innerHTML='';refreshing=false;return}setup.style.display='none';if(!data){root.className='spinner';root.textContent='Loading your rallies…'}try{data=await api();lastLoadedAt=Date.now();render(keepId)}catch(e){root.className='';root.innerHTML='<div class="notice error"><strong>Unable to open your rally page.</strong><br>'+esc(e.message)+'</div>'}finally{refreshing=false}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-lastLoadedAt>1000)load()});window.addEventListener('pageshow',()=>{if(lastLoadedAt)load()});load();
</script></body></html>
